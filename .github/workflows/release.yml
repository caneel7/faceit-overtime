name: Release

# The only path to production: publishing a GitHub Release (tag vX.Y.Z) deploys that tag.
on:
  release:
    types: [published]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://overtime.caneel.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Gate
        run: bunx turbo run typecheck lint test

      # api first: web's service binding points at it. Both use the env.production block of wrangler.jsonc.
      - name: Deploy api
        working-directory: apps/api
        run: bunx wrangler deploy --env production --var "VERSION:$VERSION"

      - name: Build and deploy web
        working-directory: apps/web
        run: |
          bunx opennextjs-cloudflare build --env production
          bunx opennextjs-cloudflare deploy --env production

      - name: Smoke check
        run: |
          for url in https://overtime-api.caneel.dev/api/health https://overtime.caneel.dev/api/health; do
            for attempt in 1 2 3 4 5; do
              got=$(curl -fsS "$url" | jq -r .version || true)
              if [ "$got" = "$VERSION" ]; then
                echo "$url -> $got"
                continue 2
              fi
              echo "$url returned '$got' (attempt $attempt), retrying"
              sleep 5
            done
            echo "::error::$url did not report $VERSION"
            exit 1
          done
