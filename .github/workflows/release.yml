name: Release

# The only path to production: publishing a GitHub Release (tag vX.Y.Z) deploys that tag.
# Split into jobs so "Re-run failed jobs" only repeats what failed:
#   gate ─────────┬─▶ deploy-api ─┐
#   build-web ────┴───────────────┴─▶ deploy-web ─▶ purge-cache ─▶ smoke
on:
  release:
    types: [published]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  gate:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
      - uses: ./.github/actions/setup
      - run: bunx turbo run typecheck lint test

  build-web:
    name: Build web (OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: apps/web
        run: bunx opennextjs-cloudflare build --env production
      - uses: actions/upload-artifact@v7
        with:
          name: web-open-next
          path: apps/web/.open-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-api:
    name: Deploy api
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://overtime-api.caneel.dev/docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
      - uses: ./.github/actions/setup
      - name: Deploy (env.production)
        working-directory: apps/api
        run: bunx wrangler deploy --env production --var "VERSION:$VERSION"

  # Runs after the api: web's service binding points at it
  deploy-web:
    name: Deploy web
    needs: [gate, build-web, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://overtime.caneel.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: web-open-next
          path: apps/web/.open-next
      - name: Deploy (env.production)
        working-directory: apps/web
        run: bunx opennextjs-cloudflare deploy --env production

  # Drop anything Cloudflare cached from the previous release so nobody is served stale responses
  purge-cache:
    name: Purge Cloudflare cache
    needs: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Purge overtime.caneel.dev and overtime-api.caneel.dev
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["overtime.caneel.dev","overtime-api.caneel.dev"]}')
          echo "$response" | jq '{success, errors}'
          if [ "$(echo "$response" | jq -r .success)" != "true" ]; then
            echo "::error::Cache purge failed"
            exit 1
          fi

  smoke:
    name: Smoke check
    needs: purge-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both hosts report the release version
        run: |
          for url in https://overtime-api.caneel.dev/api/health https://overtime.caneel.dev/api/health; do
            for attempt in 1 2 3 4 5; do
              got=$(curl -fsS "$url" | jq -r .version || true)
              if [ "$got" = "$VERSION" ]; then
                echo "$url -> $got"
                continue 2
              fi
              echo "$url returned '$got' (attempt $attempt), retrying"
              sleep 5
            done
            echo "::error::$url did not report $VERSION"
            exit 1
          done
      - name: API docs load
        run: curl -fsS -o /dev/null https://overtime-api.caneel.dev/docs
