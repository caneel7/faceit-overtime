name: CI

# Pull requests only. Nothing re-runs after merge; releases have their own gate job.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - run: bunx turbo run typecheck lint test build

  stories:
    name: Storybook interaction + a11y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium for Vitest browser mode
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium
      - run: bunx turbo run test:stories
