name: CI

# Pull requests only. Nothing re-runs after merge; releases have their own gate job.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - run: bunx turbo run typecheck lint test build

  stories:
    name: Storybook interaction + a11y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium for Vitest browser mode
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium
      - run: bunx turbo run test:stories

  # Migrations and integration tests on a throwaway copy of production's database
  db:
    name: Database (Neon branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Schema and migrations agree
        working-directory: packages/db
        run: bun run db:check
      # The branch is deleted at the end of the job; the expiry is a backstop if that step never runs
      - name: Branch expiry
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Create Neon branch from production
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: production
          branch_name: ci-pr-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}
      - name: Migrate
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bun run db:migrate
      - name: Integration tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bunx turbo run test --filter=@overtime/db --filter=@overtime/api
      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
